<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ea580c" />
    <title>Offline · ppbid</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fafafa; --card: #ffffff; --border: #e5e5e5; --text: #171717; --muted: #737373;
            --accent: #ea580c; --accent-text: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0a0a0a; --card: #171717; --border: #262626; --text: #fafafa; --muted: #a3a3a3; --accent: #fb923c; --accent-text: #431407; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: var(--bg); color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        main {
            width: 100%; max-width: 360px; text-align: center; background: var(--card);
            border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px;
        }
        .logo {
            width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px;
            background: var(--accent); color: var(--accent-text); display: grid; place-items: center;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; font-size: 15px; }
        button {
            width: 100%; border: 0; border-radius: 10px; padding: 12px 16px; font: inherit; font-weight: 600;
            background: var(--accent); color: var(--accent-text); cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="logo" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="currentColor">
                <g transform="translate(1 1) rotate(-45 14 13)">
                    <rect x="6" y="4" width="16" height="7.5" rx="2" /><rect x="5" y="3" width="3" height="9.5" rx="1.2" />
                    <rect x="20" y="3" width="3" height="9.5" rx="1.2" /><rect x="12.6" y="11" width="2.8" height="15" rx="1.4" />
                </g>
                <rect x="15.5" y="25" width="12" height="3.5" rx="1.75" />
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>ppbid needs a connection to show live bids. Check your signal or Wi-Fi and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
